<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- IBM Plex Sans / IBM Plex Mono: an industrial, technical typeface family
         chosen deliberately over the ubiquitous geometric-grotesque defaults —
         the mono face carries every numeric readout so digits stay tabular and
         a changing value never reflows its row. `display=swap` avoids FOIT;
         the CSS fallback stack in tokens.css keeps the UI legible offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AQUASHIELD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
